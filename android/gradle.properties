org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 compiles plugins' Kotlin itself. Flutter's migrator writes this
# flag as false into existing projects so they keep building, and 3.47's
# project template still does - it is an opt-in, not something a version
# bump switches on.
#
# On: mobile_scanner then stops applying the Kotlin Gradle Plugin (both
# 7.4.0 and 7.4.2 decide that from this very property), which is what the
# launch-time warning asks for and what future Flutter versions require.
# Needs Flutter 3.47+, which this project is on since the SDK bump.
android.builtInKotlin=true
